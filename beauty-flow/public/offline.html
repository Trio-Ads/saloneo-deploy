<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F97316" />
  <title>Saloneo · Hors connexion</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --card: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa; --line: #27272a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 44px; height: auto; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 6px; color: var(--muted); font-size: 15px; }
    p[dir="rtl"] { margin-top: 12px; }
    button { margin-top: 20px; width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: #F97316; color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Pas de connexion internet</h1>
    <p>Saloneo a besoin d'internet pour afficher votre planning à jour. Vérifiez le Wi-Fi ou les données mobiles.</p>
    <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقق من الشبكة ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
